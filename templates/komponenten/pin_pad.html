{% comment %}
  PIN-Pad, 4 Ziffern. Schreibt in ein verstecktes Feld (Name: feld, Standard "pin").
  Gehört in ein <form>. Der OK-Knopf ist erst bei 4 Ziffern aktiv (static/js/nestwerk.js).
{% endcomment %}
<div class="pin" data-pin>
  <input type="hidden" name="{{ feld|default:'pin' }}" value="" data-pin-feld autocomplete="off">
  <div class="pin__punkte" aria-hidden="true">
    <span class="pin__punkt" data-pin-punkt></span>
    <span class="pin__punkt" data-pin-punkt></span>
    <span class="pin__punkt" data-pin-punkt></span>
    <span class="pin__punkt" data-pin-punkt></span>
  </div>
  <div class="pin__tasten">
    <button type="button" class="pin__taste" data-pin-taste="1">1</button>
    <button type="button" class="pin__taste" data-pin-taste="2">2</button>
    <button type="button" class="pin__taste" data-pin-taste="3">3</button>
    <button type="button" class="pin__taste" data-pin-taste="4">4</button>
    <button type="button" class="pin__taste" data-pin-taste="5">5</button>
    <button type="button" class="pin__taste" data-pin-taste="6">6</button>
    <button type="button" class="pin__taste" data-pin-taste="7">7</button>
    <button type="button" class="pin__taste" data-pin-taste="8">8</button>
    <button type="button" class="pin__taste" data-pin-taste="9">9</button>
    <button type="button" class="pin__taste pin__taste--aktion" data-pin-loeschen>{% include "komponenten/icon.html" with name="pfeil-links" %}<span>Löschen</span></button>
    <button type="button" class="pin__taste" data-pin-taste="0">0</button>
    <button type="submit" class="pin__taste pin__taste--aktion pin__taste--ok" data-pin-ok disabled>{% include "komponenten/icon.html" with name="check" %}<span>OK</span></button>
  </div>
</div>

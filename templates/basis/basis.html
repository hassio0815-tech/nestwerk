{% load static %}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f20">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="{% static 'benachrichtigung/icons/icon-180.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FamKo">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block titel %}{% endblock %} · FamKo</title>
  <link rel="preload" href="{% static 'fonts/inter/Inter-Regular.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/press-start-2p/PressStart2P-Regular.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/famko.css' %}">
  {% block css %}{% endblock %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/famko.js' %}" defer></script>
  <script src="{% static 'benachrichtigung/pwa.js' %}" defer></script>
</head>
<body data-layout="{% block layout %}kind{% endblock %}" data-modus="{{ request.COOKIES.famko_modus|default:'dunkel' }}" data-akzent="{{ akzent|default:'blau' }}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "komponenten/_sprite.html" %}
  <a class="sprung-link" href="#inhalt">Zum Inhalt</a>
  <header class="kopf">
    {% block kopf %}{% endblock %}
  </header>
  <main id="inhalt" class="inhalt">
    {% block inhalt %}{% endblock %}
  </main>
  {% block navigation %}{% endblock %}
  <div class="toast-bereich" id="meldungen" aria-live="polite"></div>
  {% include "konten/_leerlauf.html" %}
</body>
</html>

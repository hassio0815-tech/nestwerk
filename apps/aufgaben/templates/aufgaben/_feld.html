<div class="feld{% if f.errors %} feld--fehler{% endif %}">
  <label class="feld__label" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required and not f.is_hidden %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ f }}
  {% for e in f.errors %}<p class="feld__hinweis feld__hinweis--fehler">{{ e }}</p>{% endfor %}
  {% if f.help_text %}<p class="feld__hinweis">{{ f.help_text }}</p>{% endif %}
</div>

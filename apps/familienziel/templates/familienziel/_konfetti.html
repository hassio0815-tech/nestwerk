{% load static %}<link rel="stylesheet" href="{% static 'css/familienziel.css' %}">
<div class="toast toast--familienziel" role="status" data-schliessbar data-popup-art="familienziel">
  <span class="konfetti" aria-hidden="true">{% for i in "123456789012" %}<i></i>{% endfor %}</span>
  {% include "komponenten/icon.html" with name="pokal" %}
  <span class="toast__text"><strong>{{ p.titel }}</strong>{% if p.text %}<br>{{ p.text }}{% endif %}</span>
  <button type="button" class="knopf knopf--geist knopf--klein" data-schliessen>{% include "komponenten/icon.html" with name="x" %}<span>Schließen</span></button>
</div>

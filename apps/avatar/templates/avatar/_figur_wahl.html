{% load i18n %}
<fieldset class="avatar-wahl__gruppe">
  <legend>{% translate "Hautton" %}</legend>
  <div class="avatar-farben">
    {% for schluessel, name, farbe in optionen.haut %}
      <label class="avatar-farbe">
        <input type="radio" name="haut" value="{{ schluessel }}"{% if figur.haut == schluessel %} checked{% endif %}>
        <svg class="avatar-farbe__feld" viewBox="0 0 1 1" aria-hidden="true"><rect width="1" height="1" fill="{{ farbe }}"/></svg>
        <span class="sr-only">{{ name }}</span>
      </label>
    {% endfor %}
  </div>
</fieldset>
<fieldset class="avatar-wahl__gruppe">
  <legend>{% translate "Haarfarbe" %}</legend>
  <div class="avatar-farben">
    {% for schluessel, name, farbe in optionen.haar %}
      <label class="avatar-farbe">
        <input type="radio" name="haar" value="{{ schluessel }}"{% if figur.haar == schluessel %} checked{% endif %}>
        <svg class="avatar-farbe__feld" viewBox="0 0 1 1" aria-hidden="true"><rect width="1" height="1" fill="{{ farbe }}"/></svg>
        <span class="sr-only">{{ name }}</span>
      </label>
    {% endfor %}
  </div>
</fieldset>
<fieldset class="avatar-wahl__gruppe">
  <legend>{% translate "Frisur" %}</legend>
  <div class="avatar-frisuren">
    {% for schluessel, name in optionen.frisur %}
      <label class="avatar-frisur">
        <input type="radio" name="frisur" value="{{ schluessel }}"{% if figur.frisur == schluessel %} checked{% endif %}>
        <span>{{ name }}</span>
      </label>
    {% endfor %}
  </div>
</fieldset>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ theme_farbe }}">
  <title>Offline · Nestwerk</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #120f20; color: #f6f4ff; font: 1.125rem/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 26rem; background: #1e1a33; border: 3px solid #443b70; border-radius: 4px;
      box-shadow: 0 5px 0 #05040c; padding: 1.5rem; }
    h1 { margin: 0 0 .5rem; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border: 3px solid #05040c; border-radius: 4px;
      background: #2563eb; color: #fff; font: inherit; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #05040c; }
  </style>
</head>
<body>
  <main>
    <h1>Keine Verbindung</h1>
    <p>Nestwerk erreicht den Server gerade nicht. Prüfe das WLAN und versuche es noch einmal.</p>
    <a href="">Neu laden</a>
  </main>
</body>
</html>
